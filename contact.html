<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="projek.css">
    <title>Layanan Psikologi Profesional</title>
</head>

<body>
    <div class="header">
        <p>Layanan Psikologi</p>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="layanan.html">Layanan</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </div>

    <div class="container contact-container">
        <div class="hero">
            <h1>Hubungi Kami</h1>
            <p>Kami siap membantu Anda. Jangan ragu untuk menghubungi kami melalui berbagai saluran komunikasi yang
                tersedia.</p>
        </div>
        <div class="contact-section">
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email Anda" required>
                </div>
                <div class="form-group">
                    <label for="pesan">Pesan</label>
                    <textarea id="pesan" name="pesan" rows="5" placeholder="Masukkan pesan Anda" required></textarea>
                </div>
                <button type="submit" class="btn btn-submit">Kirim Pesan</button>
            </form>
        </div>
    </div>



    <footer>
    </footer>

    <script src="projek.js"></script>
</body>

</html>
